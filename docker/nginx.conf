# =========================================================
#  maskhar.id — nginx static serving
#  Astro build.format: 'directory' → tiap route = folder + index.html
# =========================================================

# ---------------------------------------------------------
#  Domain lama → maskhar.id (301, pertahankan path)
#  maskhar.id satu-satunya canonical; dua salinan hidup bikin
#  duplicate content. Blok ini baru aktif kalau host tsb
#  benar-benar diarahkan ke origin ini.
# ---------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name maskhar.com www.maskhar.com maskhar.site www.maskhar.site www.maskhar.id;

    return 301 https://maskhar.id$request_uri;
}

# `_` bukan wildcard di nginx — hanya nama dummy. Yang menentukan
# default adalah `default_server`; tanpa itu block redirect di atas
# (yang listen duluan) akan menangkap healthcheck & akses via IP.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name maskhar.id _;

    root  /usr/share/nginx/html;
    index index.html;

    # Cloudflare Tunnel jadi hop terakhir — ambil IP asli pengunjung
    real_ip_header      CF-Connecting-IP;
    set_real_ip_from    0.0.0.0/0;

    charset     utf-8;
    server_tokens off;

    # ---------- keamanan ----------
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ---------- kompresi ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml application/rss+xml
                      application/manifest+json image/svg+xml font/woff font/woff2;

    # ---------- healthcheck ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- aset ber-hash: cache selamanya ----------
    # Catatan: pakai add_header saja, JANGAN digabung `expires` —
    # keduanya sama-sama menulis Cache-Control dan hasilnya header dobel.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---------- gambar & font: cache panjang, masih revalidasi ----------
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ---------- file SEO: jangan di-cache lama ----------
    location ~* ^/(robots\.txt|sitemap.*\.xml|site\.webmanifest|CNAME)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---------- HTML: selalu revalidasi biar deploy langsung kelihatan ----------
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ---------- halaman 404 bergaya terminal ----------
    # Astro selalu menulis halaman 404 sebagai /404.html (file datar),
    # bukan /404/index.html — meski build.format = 'directory'.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # ---------- jangan sajikan dotfile ----------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
